<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#111010" />

    <!-- ===== SEO =====
         Título, descripción, canonical, Open Graph por página y datos
         estructurados (JSON-LD) los escribe el prerender en cada HTML a partir
         de src/seo/meta.ts. Aquí solo va lo común a todas las páginas. -->
    <!--app-head-->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hodex" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:image" content="https://www.hodex.es/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.hodex.es/og-image.png" />

    <!-- Rendimiento: resolver los dominios de Google Fonts cuanto antes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
